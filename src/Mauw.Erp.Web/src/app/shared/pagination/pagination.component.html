<nav class="mt-4 flex flex-wrap items-center justify-between gap-3 text-sm" aria-label="Paginazione risultati">
  <span class="text-gray-600">
    {{ firstItem }}–{{ lastItem }} di {{ totalCount }}
  </span>

  <div class="flex flex-wrap items-center gap-2">
    <label class="flex items-center gap-2 text-gray-600">
      Risultati per pagina
      <select [ngModel]="pageSize" (ngModelChange)="setPageSize($event)"
        class="rounded border px-2 py-1 text-gray-800">
        <option *ngFor="let size of pageSizes" [ngValue]="size">{{ size }}</option>
      </select>
    </label>

    <button type="button" (click)="pageChange.emit(1)" [disabled]="page <= 1"
      class="flex h-9 w-9 items-center justify-center rounded border hover:bg-gray-100 disabled:opacity-40"
      aria-label="Prima pagina" title="Prima pagina">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="m11 19-7-7 7-7m9 14-7-7 7-7" />
      </svg>
    </button>
    <button type="button" (click)="pageChange.emit(page - 1)" [disabled]="page <= 1"
      class="flex h-9 w-9 items-center justify-center rounded border hover:bg-gray-100 disabled:opacity-40"
      aria-label="Pagina precedente" title="Pagina precedente">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6" />
      </svg>
    </button>

    <span class="flex items-center gap-2 text-gray-600">
      Pagina
      <input type="number" min="1" [max]="totalPages" [value]="page"
        (input)="onPageInput($event)" (keyup.enter)="goToRequestedPage()"
        class="w-16 rounded border px-2 py-1 text-center text-gray-800"
        aria-label="Numero pagina">
      di {{ totalPages }}
      <button type="button" (click)="goToRequestedPage()" [disabled]="!isRequestedPageValid"
        class="rounded border px-3 py-1 hover:bg-gray-100 disabled:opacity-40">
        Vai
      </button>
    </span>

    <button type="button" (click)="pageChange.emit(page + 1)" [disabled]="page >= totalPages"
      class="flex h-9 w-9 items-center justify-center rounded border hover:bg-gray-100 disabled:opacity-40"
      aria-label="Pagina successiva" title="Pagina successiva">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
      </svg>
    </button>
    <button type="button" (click)="pageChange.emit(totalPages)" [disabled]="page >= totalPages"
      class="flex h-9 w-9 items-center justify-center rounded border hover:bg-gray-100 disabled:opacity-40"
      aria-label="Ultima pagina" title="Ultima pagina">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="m13 5 7 7-7 7M4 5l7 7-7 7" />
      </svg>
    </button>
  </div>
</nav>
