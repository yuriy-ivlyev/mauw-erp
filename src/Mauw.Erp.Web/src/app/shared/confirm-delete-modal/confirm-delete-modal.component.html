<div *ngIf="isOpen"
  class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50"
  (click)="cancelled.emit()">

  <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm mx-4"
    (click)="$event.stopPropagation()">

    <!-- Icona + Titolo -->
    <div class="flex items-center gap-3 mb-3">
      <div class="flex-shrink-0 w-10 h-10 bg-red-100 rounded-full flex items-center justify-center">
        <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/>
        </svg>
      </div>
      <h2 class="text-lg font-bold text-gray-900">{{ title }}</h2>
    </div>

    <p class="text-gray-600 text-sm mb-6">{{ message }}</p>

    <div class="flex gap-3">
      <button type="button" (click)="confirmed.emit()"
        class="flex-1 bg-red-600 hover:bg-red-700 active:bg-red-800 text-white
               font-semibold py-2 px-4 rounded-lg transition-colors">
        Elimina
      </button>
      <button type="button" (click)="cancelled.emit()"
        class="flex-1 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700
               font-semibold py-2 px-4 rounded-lg transition-colors">
        Annulla
      </button>
    </div>
  </div>

</div>
