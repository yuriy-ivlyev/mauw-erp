<aside class="w-64 bg-gray-900 text-white h-screen fixed left-0 top-0 overflow-y-auto">
  <div class="p-6">
    <a routerLink="/" aria-label="Mauw ERP - Dashboard"
      class="mb-8 flex items-center gap-3">
      <img [src]="branding.logoUrl('compact')" alt="Mauw" width="64" height="71"
        class="h-16 w-16 rounded-lg bg-white p-2 object-contain">
      <span class="text-xl font-bold">ERP</span>
    </a>
    
    <nav class="space-y-1">
      <ng-container *ngFor="let item of menuItems">
        <!-- Menu item senza figli -->
        <ng-container *ngIf="!item.children || item.children.length === 0">
          <a 
            *ngIf="item.route"
            [routerLink]="item.route" 
            routerLinkActive="bg-blue-600" 
            class="block px-4 py-3 rounded-md hover:bg-gray-800 transition duration-200 flex items-center gap-3 group">
            <svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
              <path [attr.d]="getSvgPath(item.icon)"/>
            </svg>
            <span class="text-sm font-medium">{{ item.label }}</span>
          </a>
        </ng-container>

        <!-- Menu item con figli -->
        <ng-container *ngIf="item.children && item.children.length > 0">
          <div 
            (click)="toggleSubmenu(item)"
            class="px-4 py-3 rounded-md hover:bg-gray-800 transition duration-200 cursor-pointer flex items-center justify-between gap-3 group">
            <span class="flex items-center gap-3 flex-1">
              <svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
                <path [attr.d]="getSvgPath(item.icon)"/>
              </svg>
              <span class="text-sm font-medium">{{ item.label }}</span>
            </span>
            <svg 
              class="w-4 h-4 transition-transform duration-200 flex-shrink-0"
              [class.rotate-180]="!item.isCollapsed"
              fill="none" 
              stroke="currentColor" 
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
            </svg>
          </div>

          <!-- Sottomenu -->
          <div 
            class="ml-4 space-y-1 overflow-hidden transition-all duration-200"
            [class.hidden]="item.isCollapsed"
            *ngIf="!item.isCollapsed">
            <ng-container *ngFor="let child of item.children">
              <ng-container *ngIf="canSee(child)">
              <!-- Separatore / etichetta di sezione -->
              <div *ngIf="child.isSeparator"
                class="px-4 pt-3 pb-1 text-xs font-semibold text-gray-500 uppercase tracking-widest select-none">
                {{ child.label }}
              </div>
              <!-- Voce normale -->
              <a *ngIf="!child.isSeparator"
                [routerLink]="child.route" 
                routerLinkActive="bg-blue-600"
                class="block px-4 py-2 rounded-md hover:bg-gray-700 transition duration-200 flex items-center gap-3 text-sm text-gray-300 hover:text-white">
                <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
                  <path [attr.d]="getSvgPath(child.icon)"/>
                </svg>
                <span class="text-xs font-medium">{{ child.label }}</span>
              </a>
              </ng-container>
            </ng-container>
          </div>
        </ng-container>
      </ng-container>
    </nav>
  </div>
</aside>
