version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mauw-erp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mauw_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/var/lib/postgresql/backups
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mauw-network

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: mauw-erp-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"   # API S3
      - "127.0.0.1:9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      # immagine senza curl/mc: sonda HTTP /minio/health/ready via bash
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r line <&3 && [[ $$line == *200* ]]"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mauw-network

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # mc legge l'alias "local" da questa variabile
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@minio:9000
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET:-mauw-erp-images}"]
    networks:
      - mauw-network
    restart: "no"

volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local
  minio_data:
    driver: local

networks:
  mauw-network:
    driver: bridge
