version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mauw-erp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mauw_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/var/lib/postgresql/backups
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mauw-network

volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local

networks:
  mauw-network:
    driver: bridge
