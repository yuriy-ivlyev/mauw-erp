services:
  postgres:
    image: postgres:16-alpine
    container_name: mauw-erp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mauw_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/var/lib/postgresql/backups
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mauw-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: mauw-erp-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - mauw-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: mauw-erp-api
    image: mauw-erp-api:local
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=mauw_erp;Username=postgres;Password=postgres;Port=5432"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: mauw-erp-backend
      AzureAd__ClientSecret: "${AZURE_CLIENT_SECRET}"
    # Nessuna porta pubblicata: l'API e' raggiungibile solo dalla rete interna (web -> api:8080)
    expose:
      - "8080"
    networks:
      - mauw-network
    restart: unless-stopped

  web:
    build:
      context: ./src/Mauw.Erp.Web
      dockerfile: Dockerfile
    container_name: mauw-erp-web
    image: mauw-erp-web:local
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:8080
    networks:
      - mauw-network
    restart: unless-stopped

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: mauw-erp-proxy
    image: mauw-erp-proxy:local
    depends_on:
      - web
    environment:
      CERT_PASSWORD: "${CERT_PASSWORD:-MauwDev2024!}"
      WEB_UPSTREAM: http://web:80
    ports:
      # 5019 e' la porta HTTPS storica (redirect URI Entra ID: https://localhost:5019/signin-oidc)
      - "${HTTPS_PORT:-5019}:443"
    volumes:
      - ./certs:/certs:ro
    networks:
      - mauw-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local

networks:
  mauw-network:
    driver: bridge