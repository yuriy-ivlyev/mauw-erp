services:
  postgres:
    image: postgres:16-alpine
    container_name: mauw-erp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mauw_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/var/lib/postgresql/backups
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mauw-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: mauw-erp-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - mauw-network
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: mauw-erp-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?definire MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definire MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"   # API S3
      - "127.0.0.1:9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      # immagine senza curl/mc: sonda HTTP /minio/health/ready via bash
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r line <&3 && [[ $$line == *200* ]]"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mauw-network
    restart: unless-stopped

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # mc legge l'alias "local" da questa variabile (credenziali senza caratteri speciali URL)
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET:-mauw-erp-images}"]
    networks:
      - mauw-network
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: mauw-erp-api
    image: mauw-erp-api:local
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      S3Storage__Endpoint: "http://minio:9000"
      S3Storage__AccessKey: "${MINIO_ROOT_USER}"
      S3Storage__SecretKey: "${MINIO_ROOT_PASSWORD}"
      S3Storage__BucketName: "${S3_BUCKET:-mauw-erp-images}"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: "${API_DB_CONNECTION:-Host=postgres;Database=mauw_erp;Username=postgres;Password=postgres;Port=5432}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: mauw-erp-backend
      AzureAd__ClientSecret: "${AZURE_CLIENT_SECRET}"
    # Nessuna porta pubblicata: l'API e' raggiungibile solo dalla rete interna (web -> api:8080)
    expose:
      - "8080"
    networks:
      - mauw-network
    restart: unless-stopped

  web:
    build:
      context: ./src/Mauw.Erp.Web
      dockerfile: Dockerfile
    container_name: mauw-erp-web
    image: mauw-erp-web:local
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:8080
    networks:
      - mauw-network
    restart: unless-stopped

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: mauw-erp-proxy
    image: mauw-erp-proxy:local
    depends_on:
      - web
    environment:
      CERT_PASSWORD: "${CERT_PASSWORD:-MauwDev2024!}"
      WEB_UPSTREAM: http://web:80
    ports:
      # 5019 e' la porta HTTPS storica (redirect URI Entra ID: https://localhost:5019/signin-oidc)
      - "${HTTPS_PORT:-5019}:443"
    volumes:
      - ./certs:/certs:ro
    networks:
      - mauw-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local
  minio_data:
    driver: local

networks:
  mauw-network:
    driver: bridge