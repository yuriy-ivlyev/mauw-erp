version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mauw-erp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mauw_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/var/lib/postgresql/backups
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mauw-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: mauw-erp-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - mauw-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: mauw-erp-api
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "https://+:8443"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /certs/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: "MauwDev2024!"
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=mauw_erp;Username=postgres;Password=postgres;Port=5432"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: mauw-erp-backend
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      AzureAd__TenantId: "${AZURE_TENANT_ID}"
      AzureAd__ClientId: "${AZURE_CLIENT_ID}"
      AzureAd__ClientSecret: "${AZURE_CLIENT_SECRET}"
    ports:
      - "5019:8443"
    volumes:
      - ./certs:/certs:ro
    networks:
      - mauw-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local

networks:
  mauw-network:
    driver: bridge